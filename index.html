<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Démo Chatbot Jøtul</title>
  <style>
    :root {
      --bg: #0f172a;          /* slate-900 */
      --panel: #111827;       /* gray-900 */
      --panel-2: #1f2937;     /* gray-800 */
      --text: #e5e7eb;        /* gray-200 */
      --muted: #9ca3af;       /* gray-400 */
      --brand: #60a5fa;       /* blue-400 */
      --brand-2: #93c5fd;     /* blue-300 */
      --success: #34d399;     /* emerald-400 */
      --danger: #f87171;      /* red-400 */
      --bubble-user: #1e3a8a; /* blue-900 */
      --bubble-bot: #374151;  /* gray-700 */
      --radius: 16px;
      --shadow: 0 10px 25px rgba(0,0,0,0.35);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial, "Noto Sans", "Apple Color Emoji", "Segoe UI Emoji";
      background: radial-gradient(1200px 600px at 80% -20%, rgba(96,165,250,0.15), transparent 60%),
                  radial-gradient(1000px 500px at -10% 120%, rgba(16,185,129,0.12), transparent 60%),
                  var(--bg);
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .app {
      width: min(900px, 100%);
      height: min(720px, 92vh);
      background: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 24px;
      box-shadow: var(--shadow);
      display: grid;
      grid-template-rows: auto 1fr auto;
      overflow: hidden;
      backdrop-filter: blur(6px);
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      background: linear-gradient(180deg, rgba(17,24,39,0.95), rgba(17,24,39,0.70));
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .brand {
      display: flex; gap: 12px; align-items: center;
    }
    .brand .dot {
      width: 12px; height: 12px; border-radius: 50%; background: var(--brand);
      box-shadow: 0 0 14px var(--brand);
    }
    .brand h1 { font-size: 16px; margin: 0; letter-spacing: .4px; }
    .actions { display: flex; gap: 8px; }
    .btn {
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      padding: 8px 12px;
      cursor: pointer;
      transition: transform .08s ease, background .2s ease, border-color .2s ease;
    }
    .btn:hover { transform: translateY(-1px); border-color: rgba(255,255,255,0.18); }
    .btn.primary { background: linear-gradient(180deg, var(--brand), var(--brand-2)); color: #0b1020; font-weight: 600; border: none; }
    .btn.success { background: linear-gradient(180deg, #10b981, #34d399); color: #03221a; border: none; font-weight: 600; }
    .btn.ghost { background: transparent; border-color: rgba(255,255,255,0.2); }

    .timeline {
      padding: 18px;
      overflow: auto;
      scroll-behavior: smooth;
      background: linear-gradient(180deg, rgba(31,41,55,0.5), rgba(17,24,39,0.2));
    }

    .bubble {
      max-width: 78%;
      margin: 8px 0;
      padding: 12px 14px;
      border-radius: var(--radius);
      line-height: 1.45;
      box-shadow: 0 8px 18px rgba(0,0,0,0.25);
      animation: fadeUp .22s ease both;
      border: 1px solid rgba(255,255,255,0.06);
    }
    .bot { background: var(--bubble-bot); border-top-left-radius: 6px; }
    .user { background: var(--bubble-user); border-top-right-radius: 6px; margin-left: auto; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .choices, .form {
      padding: 12px 18px;
      display: flex;
      gap: 10px; flex-wrap: wrap;
      background: rgba(17,24,39,0.85);
      border-top: 1px solid rgba(255,255,255,0.06);
    }

    .choice {
      display: inline-flex;
      align-items: center; justify-content: center;
      padding: 10px 14px;
      border-radius: 999px;
      background: #0b1222;
      border: 1px solid rgba(255,255,255,0.1);
      color: var(--text);
      cursor: pointer;
      transition: transform .08s ease, background .2s ease, border-color .2s ease;
    }
    .choice:hover { transform: translateY(-1px); border-color: rgba(255,255,255,0.25); }

    .form { gap: 12px; }
    .form input, .form button {
      height: 40px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.1);
      background: #0b1222; color: var(--text);
      padding: 0 12px;
    }
    .form input::placeholder { color: var(--muted); }
    .form button { cursor: pointer; padding: 0 16px; }

    .small { color: var(--muted); font-size: 12px; }
    .notice { font-size: 13px; color: var(--muted); margin-top: 4px; }

    .footer-note { padding: 8px 18px; font-size: 12px; color: var(--muted); text-align: center; }

  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">
        <span class="dot" aria-hidden="true"></span>
        <h1>Assistant Jøtul — Démo</h1>
      </div>
      <div class="actions">
        <button id="btn-reset" class="btn ghost" title="Recommencer">Réinitialiser</button>
        <button id="btn-autoplay" class="btn primary" title="Lecture auto">Lecture auto</button>
        <button id="btn-export" class="btn" title="Exporter le transcript">Exporter</button>
      </div>
    </header>

    <main id="timeline" class="timeline" aria-live="polite" aria-atomic="false"></main>

    <div id="choices" class="choices"></div>

    <div class="footer-note">Scénarios d'assistance pour poêle à granulés et poêle à bois. Démo locale, aucune donnée envoyée.</div>
  </div>

  <script>
    // =====================
    // Utilitaires d'UI
    // =====================
    const timeline = document.getElementById('timeline');
    const choicesEl = document.getElementById('choices');

    const addBubble = (text, who = 'bot') => {
      const b = document.createElement('div');
      b.className = `bubble ${who}`;
      b.textContent = text;
      timeline.appendChild(b);
      timeline.scrollTop = timeline.scrollHeight;
      return b;
    };

    const clearChoices = () => choicesEl.innerHTML = '';

    const addChoice = (label, onClick) => {
      const c = document.createElement('button');
      c.className = 'choice';
      c.textContent = label;
      c.addEventListener('click', onClick);
      choicesEl.appendChild(c);
      return c;
    };

    const pause = (ms) => new Promise(res => setTimeout(res, ms));

    // =====================
    // Modèle de scénario
    // =====================
    // États et transitions (simplifié/linéaire selon flux fourni)
    const state = {
      history: [], // {role:'bot'|'user', text}
      data: {},
      autoplay: false,
    };

    const push = (role, text) => {
      state.history.push({ role, text, ts: Date.now() });
    };

    function resetAll() {
      timeline.innerHTML = '';
      clearChoices();
      state.history = [];
      state.data = {};
      state.autoplay = false;
      document.getElementById('btn-autoplay').textContent = 'Lecture auto';
      intro();
    }

    // =====================
    // Scénario Jøtul (granulés)
    // =====================
    async function intro() {
      addBubble("Bonjour, je suis l’assistant Jøtul. Vous avez un souci avec votre poêle ? Je vais vous aider à comprendre d’où ça vient.");
      await pause(400);
      clearChoices();
      addChoice('Commencer', () => typePoele());
    }

    function typePoele() {
      addBubble('Quel type de poêle avez-vous ?');
      clearChoices();
      addChoice('Poêle à bois', () => boisEntry());
      addChoice('Poêle à granulés', () => etape1());
    }

    function conclusionBois() {
      clearChoices();
      addBubble("Pour cette démo, le diagnostic détaillé couvre le poêle à granulés. Pour un poêle à bois, un technicien peut vous conseiller.");
      addChoice('Revenir', () => typePoele());
    }

    // =====================
    // Scénario Poêle à bois
    // =====================
    function boisEntry() {
      clearChoices();
      addBubble('Quel est votre souci principal avec le poêle à bois ?');
      addChoice('Démarrage / combustion', () => boisStart1());
      addChoice('Fumées / odeurs', () => boisSmoke1());
      addChoice('Revenir', () => typePoele());
    }

    // ——— Démarrage / Combustion ———
    function boisStart1() {
      clearChoices();
      addBubble('Le bois utilisé est-il bien sec (humidité < 20%) ?');
      addChoice('Oui', () => boisAir());
      addChoice('Non', () => {
        addBubble("Utilisez du bois sec (≥ 18 mois de séchage), fendez des bûches fines et allumez en top-down. Est-ce mieux après essai ?");
        clearChoices();
        addChoice('Oui', () => finalOK());
        addChoice('Non', () => boisAir());
      });
    }

    function boisAir() {
      clearChoices();
      addBubble("Les arrivées d'air (primaire/secondaire) sont-elles bien ouvertes ?");
      addChoice('Oui', () => boisDraft());
      addChoice('Non', () => {
        addBubble("Ouvrez totalement les arrivées d'air pour l'allumage et les 15 premières minutes. Est-ce mieux ?");
        clearChoices();
        addChoice('Oui', () => finalOK());
        addChoice('Non', () => boisDraft());
      });
    }

    function boisDraft() {
      clearChoices();
      addBubble('Le tirage semble-t-il correct (conduit chaud, clapet ouvert) et le conduit a-t-il été ramoné depuis moins d\'un an ?');
      addChoice('Oui', () => boisDoor());
      addChoice('Non', () => {
        addBubble("Pré-chauffez le conduit (allume-feu/papier), ouvrez le clapet, vérifiez l'absence d'obstruction et planifiez un ramonage si nécessaire. Est-ce mieux ?");
        clearChoices();
        addChoice('Oui', () => finalOK());
        addChoice('Non', () => boisDoor());
      });
    }

    function boisDoor() {
      clearChoices();
      addBubble('La porte ferme-t-elle correctement et les joints sont-ils en bon état ?');
      addChoice('Oui', () => boisResult());
      addChoice('Non', () => {
        addBubble("Faites remplacer ou recoller les joints, puis réessayez. Est-ce mieux ?");
        clearChoices();
        addChoice('Oui', () => finalOK());
        addChoice('Non', () => boisResult());
      });
    }

    function boisResult() {
      clearChoices();
      addBubble('Après ces vérifications, le feu démarre et se maintient-il correctement ?');
      addChoice('Oui', () => finalOK());
      addChoice('Non', () => savCollect());
    }

    // ——— Fumées / Odeurs ———
    function boisSmoke1() {
      clearChoices();
      addBubble('Avez-vous des fumées qui refoulent dans la pièce ?');
      addChoice('Oui', () => boisSmokeAir());
      addChoice('Non', () => boisEntry());
    }

    function boisSmokeAir() {
      clearChoices();
      addBubble("Les arrivées d'air sont-elles ouvertes et la pièce est-elle suffisamment ventilée ?");
      addChoice('Oui', () => boisSmokeDraft());
      addChoice('Non', () => {
        addBubble("Ouvrez les arrivées d'air et une fenêtre quelques minutes, puis rallumez. Est-ce mieux ?");
        clearChoices();
        addChoice('Oui', () => finalOK());
        addChoice('Non', () => boisSmokeDraft());
      });
    }

    function boisSmokeDraft() {
      clearChoices();
      addBubble("Le conduit a-t-il été ramoné (< 1 an) et le chapeau n'est-il pas obstrué (nid, suie) ?");
      addChoice('Oui', () => boisSmokeResult());
      addChoice('Non', () => {
        addBubble("Faites ramoner et vérifiez le chapeau. En attendant, évitez d'utiliser l'appareil si le refoulement persiste. Après intervention, est-ce mieux ?");
        clearChoices();
        addChoice('Oui', () => finalOK());
        addChoice('Non', () => boisSmokeResult());
      });
    }

    function boisSmokeResult() {
      clearChoices();
      addBubble("Après ces vérifications, la fumée s'évacue-t-elle correctement ?");
      addChoice('Oui', () => finalOK());
      addChoice('Non', () => savCollect());
    }

    // 1. Démarrage
    function etape1() {
      clearChoices();
      addBubble('Votre poêle ne démarre pas ?');
      addChoice('Oui', () => etape2());
      addChoice('Non', () => finalOK());
    }

    // 2. Vérification des granulés
    function etape2() {
      clearChoices();
      addBubble('Le réservoir contient-il encore des granulés ?');
      addChoice('Oui', () => etape3());
      addChoice('Non', () => {
        addBubble('Remplissez le réservoir, puis essayez à nouveau de démarrer. Est-ce que ça fonctionne ?');
        clearChoices();
        addChoice('Oui', () => finalOK());
        addChoice('Non', () => etape3());
      });
    }

    // 3. Alimentation électrique
    function etape3() {
      clearChoices();
      addBubble('Le poêle est-il bien branché à la prise murale ?');
      addChoice('Oui', () => etape3bis());
      addChoice('Non', () => {
        addBubble('Branchez-le correctement puis testez à nouveau. Est-ce que ça démarre ?');
        clearChoices();
        addChoice('Oui', () => finalOK());
        addChoice('Non', () => etape4());
      });
    }

    function etape3bis() {
      clearChoices();
      addBubble('Avez-vous du courant dans la maison ? (Compteur, prises)');
      addChoice('Oui', () => etape4());
      addChoice('Non', () => {
        addBubble('Vérifiez votre alimentation générale (disjoncteur/compteur) puis réessayez.');
        clearChoices();
        addChoice('Ça démarre', () => finalOK());
        addChoice('Toujours pas', () => etape4());
      });
    }

    // 4. Bruit de la vis sans fin
    function etape4() {
      clearChoices();
      addBubble('Entendez-vous un léger bruit de moteur (la vis qui fait descendre les granulés) ?');
      addChoice('Oui', () => etape5());
      addChoice('Non', () => etape5());
    }

    // 5. Fermeture de la porte
    function etape5() {
      clearChoices();
      addBubble('La porte est-elle bien fermée et les joints en bon état ?');
      addChoice('Oui', () => etape6());
      addChoice('Non', () => etape6());
    }

    // 6. Résultat
    function etape6() {
      clearChoices();
      addBubble('Après ces vérifications, est-ce que le poêle démarre ?');
      addChoice('Oui', () => finalOK());
      addChoice('Non', () => savCollect());
    }

    // 6.a OK
    function finalOK() {
      clearChoices();
      addBubble('Super, tout est rentré dans l’ordre ✅');
      addChoice('Recommencer', resetAll);
    }

    // 6.b Collecte d’infos pour SAV
    function savCollect() {
      clearChoices();
      addBubble("Pas de souci, un technicien va vous recontacter rapidement. Pour gagner du temps, merci de renseigner :");

      // Affiche un "formulaire" en bas sous forme de ligne d'inputs
      renderForm([
        { name: 'fullname', placeholder: 'Nom et prénom', type: 'text', required: true },
        { name: 'phone', placeholder: 'Téléphone', type: 'tel', required: true },
        { name: 'model', placeholder: 'Marque et modèle du poêle', type: 'text', required: true },
        { name: 'serial', placeholder: 'Numéro de série', type: 'text', required: true },
        { name: 'photo', placeholder: 'Joindre une photo (URL – optionnel)', type: 'url', required: false },
      ], (data) => {
        state.data = data;
        addBubble('Merci. Votre demande est transmise à notre équipe technique. Un conseiller vous rappellera rapidement pour convenir de la suite.');
        clearChoices();
        addChoice('Exporter la demande', exportTranscript);
        addChoice('Recommencer', resetAll);
      });
    }

    function renderForm(fields, onSubmit) {
      clearChoices();
      const form = document.createElement('div');
      form.className = 'form';

      const inputs = {};
      fields.forEach(f => {
        const input = document.createElement('input');
        input.name = f.name;
        input.placeholder = f.placeholder;
        input.type = f.type || 'text';
        input.required = !!f.required;
        input.autocomplete = 'off';
        inputs[f.name] = input;
        form.appendChild(input);
      });

      const submit = document.createElement('button');
      submit.className = 'btn success';
      submit.textContent = 'Valider';
      submit.addEventListener('click', () => {
        const data = {};
        let ok = true;
        for (const f of fields) {
          const v = (inputs[f.name].value || '').trim();
          if (f.required && !v) { inputs[f.name].focus(); ok = false; break; }
          data[f.name] = v;
        }
        if (!ok) return;
        onSubmit(data);
        form.remove();
      });

      form.appendChild(submit);
      choicesEl.appendChild(form);

      const helper = document.createElement('div');
      helper.className = 'notice';
      helper.textContent = 'Astuce : pour la vidéo, remplissez avec des données de démonstration.';
      choicesEl.appendChild(helper);
    }

    // =====================
    // Export transcript (JSON)
    // =====================
    function exportTranscript() {
      const payload = {
        title: 'Démo Chatbot Jøtul',
        createdAt: new Date().toISOString(),
        history: Array.from(timeline.querySelectorAll('.bubble')).map(b => ({
          who: b.classList.contains('user') ? 'user' : 'bot',
          text: b.textContent
        })),
        formData: state.data || null,
        version: 1
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'transcript-jotul-demo.json';
      a.click();
      URL.revokeObjectURL(url);
    }

    // Boutons barre d'en-tête
    document.getElementById('btn-reset').addEventListener('click', resetAll);
    document.getElementById('btn-export').addEventListener('click', exportTranscript);

    // =====================
    // Lecture automatique pour vidéo
    // =====================
    // Défile le scénario de bout en bout tout seul
    async function autoplay() {
      state.autoplay = !state.autoplay;
      const btn = document.getElementById('btn-autoplay');
      btn.textContent = state.autoplay ? 'Arrêter' : 'Lecture auto';
      if (!state.autoplay) return;

      resetForAutoplay();

      // Séquence automatique : granulés → Oui/Non variés → collecte SAV
      await pause(400);
      // Commencer
      simulateClick(() => typePoele());
      await pause(500);
      // Choix type : Poêle à granulés
      simulateClick(() => etape1());
      await pause(500);
      // Étape 1 : ne démarre pas → Oui
      simulateClick(() => etape2());
      await pause(500);
      // Étape 2 : réservoir ? → Oui
      simulateClick(() => etape3());
      await pause(500);
      // Étape 3 : branché ? → Oui → courant ? → Oui
      simulateClick(() => etape3bis());
      await pause(500);
      simulateClick(() => etape4());
      await pause(500);
      // Étape 4 : bruit vis sans fin ? → Oui
      simulateClick(() => etape5());
      await pause(500);
      // Étape 5 : porte/joints ? → Oui
      simulateClick(() => etape6());
      await pause(500);
      // Étape 6 : après vérifs, démarre ? → Non → Collecte
      simulateClick(() => savCollect());

      // Remplir automatiquement des données de démo
      await pause(600);
      const inputs = choicesEl.querySelectorAll('input');
      const demo = ['Jean Dupont', '+33 6 12 34 56 78', 'Jøtul PF 123', 'SN-ABC-2025-001', 'https://picsum.photos/seed/jotul/400/280'];
      inputs.forEach((inp, i) => inp.value = demo[i] || '');
      const btnValidate = choicesEl.querySelector('button.btn.success');
      if (btnValidate) btnValidate.click();

      await pause(600);
      clearChoices();
      addChoice('Recommencer', resetAll);
    }

    function simulateClick(next) { next(); }

    function resetForAutoplay() {
      timeline.innerHTML = '';
      clearChoices();
      addBubble('— DÉMO AUTOMATIQUE —', 'user');
      intro();
    }

    document.getElementById('btn-autoplay').addEventListener('click', autoplay);

    // Boot
    intro();

  </script>
</body>
</html>
